name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh
      - name: daemon.json is valid JSON
        run: python3 -m json.tool config/daemon.json > /dev/null
